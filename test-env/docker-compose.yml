name: bulwark-plugins-test

# Backend services for plugin end-to-end tests. See README.md.
#
# Host ports are picked to stay clear of the webmail integration stack
# (8025/1025/1143) and other local containers.

services:
  stalwart:
    build:
      context: stalwart
    container_name: bpt-stalwart
    ports:
      - "18025:8080"
      - "11587:587"
    volumes:
      - stalwart-data:/var/lib/stalwart
      - stalwart-config:/etc/stalwart
    environment:
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-admin:bootstrap-secret}
      TEST_ACCOUNT_PASSWORD: ${TEST_ACCOUNT_PASSWORD:-test-pass-123}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u alice@example.org:$${TEST_ACCOUNT_PASSWORD} http://127.0.0.1:8080/jmap/session >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  nextcloud:
    image: nextcloud:34.0.4-apache
    container_name: bpt-nextcloud
    ports:
      - "18080:80"
    volumes:
      - nextcloud-html:/var/www/html
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin-pass-123}
      # localhost for the browser and the webmail on the host, the container
      # names for other containers on the compose network.
      NEXTCLOUD_TRUSTED_DOMAINS: localhost localhost:18080 127.0.0.1 127.0.0.1:18080 bpt-nextcloud nextcloud
      OVERWRITECLIURL: http://localhost:18080
      PHP_UPLOAD_LIMIT: 1G
      PHP_MEMORY_LIMIT: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  stalwart-data:
  stalwart-config:
  nextcloud-html:
